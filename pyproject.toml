[project]
name = "tino"
version = "0.1.0"
description = "Turning small decoder LMs into Jev-style typed decision models: finetuned, adapter, and distilled variants."
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.3",
  "mlx-lm==0.32.0",
  "numpy>=1.26",
  "huggingface_hub>=0.34",
]

[project.optional-dependencies]
wandb = ["wandb>=0.21"]

[tool.uv]
package = false

[dependency-groups]
figures = [
    "markdown>=3.11.2",
    "matplotlib>=3.11.2",
]
